<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>🍻 Cardápio Digital — Faça seu Pedido</title>
  <meta name="description" content="Toque aqui para abrir o Cardápio Digital da sua Mesa ou Comanda direto no celular." />

  <!-- OpenGraph / WhatsApp Preview SEO -->
  <meta property="og:title" content="🍻 Cardápio Digital — Faça seu Pedido!" />
  <meta property="og:description" content="Toque neste link para acessar o cardápio e fazer seu pedido direto pelo celular." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#FF8C00" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1E1E1E;
      border: 1px solid #333333;
      border-radius: 20px;
      padding: 28px 22px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      color: #FF8C00;
      margin-bottom: 8px;
    }
    p.sub {
      font-size: 14px;
      color: #CCCCCC;
      line-height: 1.45;
      margin-bottom: 20px;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #25D366;
      color: #FFFFFF;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 30px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    .btn:active {
      opacity: 0.85;
    }
    .wifi-tip {
      background-color: #262626;
      border: 1px solid #383838;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #AAAAAA;
      line-height: 1.4;
    }
    .url-text {
      margin-top: 12px;
      font-size: 11px;
      color: #777777;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🍻</div>
    <h1 id="titulo">Abrindo Cardápio Digital...</h1>
    <p class="sub" id="subtitulo">Aguarde um instante ou toque no botão abaixo para acessar seu cardápio.</p>

    <a id="btn-abrir" class="btn" href="#">🍽️ Abrir Cardápio Agora</a>

    <div class="wifi-tip">
      📶 <strong>Importante:</strong> Para abrir o cardápio, seu celular precisa estar conectado no <strong>Wi-Fi do estabelecimento</strong>.
    </div>

    <div class="url-text" id="url-info"></div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var directUrl = params.get("u");
      var ip = params.get("ip") || "192.168.0.49";
      var port = params.get("p") || "4000";
      var mesa = params.get("mesa");
      var comanda = params.get("comanda");

      var target = "";
      if (directUrl) {
        target = directUrl;
      } else {
        var base = "http://" + ip + (port ? ":" + port : "");
        if (mesa) {
          target = base + "/cardapio/" + encodeURIComponent(mesa);
          document.getElementById("titulo").textContent = "Cardápio Digital";
          document.getElementById("subtitulo").textContent = "Redirecionando para o cardápio da sua Mesa...";
        } else if (comanda) {
          target = base + "/cardapio/comanda/" + encodeURIComponent(comanda);
          document.getElementById("titulo").textContent = "Cardápio — Comanda " + comanda;
          document.getElementById("subtitulo").textContent = "Redirecionando para o cardápio da sua Comanda...";
        } else {
          target = base + "/cardapio";
        }
      }

      var btn = document.getElementById("btn-abrir");
      var info = document.getElementById("url-info");
      if (target) {
        btn.href = target;
        info.textContent = target;
        // Redireciona automaticamente para o IP local no Safari (iPhone) e Chrome (Android)
        setTimeout(function () {
          window.location.replace(target);
        }, 80);
      }
    })();
  </script>
</body>
</html>
